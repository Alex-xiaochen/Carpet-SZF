# Done to increase the memory available to gradle.
# Four Loom instances get configured in a single build, so 1G is not enough.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Tooling
# Used by dev.kikugie.loom-back-compat, which picks net.fabricmc.fabric-loom-remap
# for obfuscated Minecraft (<26) and net.fabricmc.fabric-loom for the rest.
loomx.loom_version=1.17.21

# Mod Properties
mod_version=1.2
maven_group=com.szf

# Loader is version-agnostic, so it is shared by every version.
# 0.19.5 is the floor: Carpet 26.3 (maven.modrinth:carpet:26.3) refuses to load on older.
loader_version=0.19.5

# Per-version values (fabric_api_version, carpet_core_version) now live in
# versions/<minecraft version>/gradle.properties.
